# Required metadata
sonar.projectKey=OpenLaw
sonar.projectName=OpenLaw
sonar.projectVersion=0.0.1

# Source and test directories
sonar.sources=apps,packages,services,e2e,styles,scripts
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.next/**,\
  **/build/**,\
  **/coverage/**,\
  **/.turbo/**,\
  **/*.d.ts

sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,e2e/tests/**

# Language file suffixes
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# =============================================================================
# RULE SUPPRESSIONS
# =============================================================================
# S6478 (false positive: ListEditor render-prop callbacks, invoked as
# plain functions, never rendered as a JSX element type) and S6479
# (false positive: read-only lists rebuilt whole, never reordered) are
# suppressed for their specific files. This is a project-level server
# setting in this SonarQube edition (Community) — it does NOT work as a
# scanner property here, so it is set via:
#   POST /api/settings/set?key=sonar.issue.ignore.multicriteria&component=OpenLaw
#     &fieldValues={"ruleKey":"typescript:S6478","resourceKey":"**/settings-approver-groups.tsx"}
#     ...(one fieldValues entry per rule/file pair)
# View or edit at: http://localhost:9000/project/settings?id=OpenLaw&category=exclusions
