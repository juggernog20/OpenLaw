# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
        with:
          cache-scope: quality

      - run: pnpm check:static
      - run: pnpm test:ci-tools

  tests:
    name: ${{ matrix.package }} tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [api, web]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-workspace
        with:
          cache-scope: tests-${{ matrix.package }}-${{ matrix.shard }}

      - uses: docker/setup-buildx-action@v3
        if: matrix.package == 'api'

      - name: Build the real doc-engine image
        if: matrix.package == 'api'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/doc-engine/Dockerfile
          load: true
          tags: openlaw-doc-engine:test
          cache-from: type=gha,scope=ci-doc-engine-v1
          # E2E is the sole writer for the candidate's shared image cache.

      - name: Run the test shard
        env:
          TEST_PACKAGE: ${{ matrix.package }}
          TEST_SHARD: ${{ matrix.shard }}/2
          DOC_ENGINE_TEST_IMAGE: openlaw-doc-engine:test
        run: >-
          pnpm exec turbo run test --filter="@openlaw/$TEST_PACKAGE" --summarize
          -- --shard="$TEST_SHARD"

      - name: Upload task timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timings-${{ matrix.package }}-${{ matrix.shard }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore
          retention-days: 7

  # Keep the existing check name as the aggregate for branch protection.
  check:
    name: Lint, typecheck, test
    needs: [quality, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every static check and test shard
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: test "$QUALITY_RESULT" = success && test "$TEST_RESULT" = success

  openapi-current:
    name: OpenAPI artifact is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-workspace
        with:
          cache-scope: openapi

      # openapi.json and the generated client are committed artifacts
      # (TECH-003). Regenerate and fail if the result differs from what
      # was pushed.
      - run: pnpm openapi

      - name: Fail if regeneration changed committed output
        run: |
          if ! git diff --exit-code -- apps/api/openapi.json packages/api-client/src/schema.ts; then
            echo "::error::openapi.json / api-client are stale — run 'pnpm openapi' and commit the result."
            exit 1
          fi

  # The deployment-fidelity gate (TECH-018): the browser E2E suite runs
  # against images built by the real Dockerfiles, brought up by the
  # blessed compose.yml plus the dev overlay (Mailpit only). This is what
  # catches "works with vite dev / breaks in the built image" drift. The
  # e2e package's lint/typecheck ride in the `quality` job above; only
  # the browser run lives here, because it needs the live stack.
  e2e:
    name: E2E against the built Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-workspace
        with:
          cache-scope: e2e

      - uses: docker/setup-buildx-action@v3

      - name: Install the Playwright browser
        run: pnpm --filter @openlaw/e2e exec playwright install --with-deps chromium

      # compose.yml refuses to start without AUTH_SECRET or
      # OPENLAW_SECRET_KEY (env_file: .env). Throwaway per-run values are
      # exactly right for a stack whose volumes never outlive the job.
      - name: Write the CI .env
        run: |
          {
            echo "AUTH_SECRET=$(openssl rand -base64 32)"
            echo "OPENLAW_SECRET_KEY=$(openssl rand -base64 32)"
          } > .env

      - name: Build the stack from the real Dockerfiles
        uses: docker/bake-action@v6
        with:
          source: .
          files: |
            compose.yml
            compose.dev.yml
          # The worker uses the app's image with a different command.
          targets: app,doc-engine
          load: true
          set: |
            app.cache-from=type=gha,scope=ci-app-v1
            app.cache-to=type=gha,scope=ci-app-v1,mode=max
            doc-engine.cache-from=type=gha,scope=ci-doc-engine-v1
            doc-engine.cache-to=type=gha,scope=ci-doc-engine-v1,mode=max

      # Fresh volumes by construction — the runner has none. The suite's
      # bootstrap probe takes the fresh-instance path via first-run setup.
      - name: Start the stack
        run: docker compose -f compose.yml -f compose.dev.yml up -d --no-build

      # Poll the readiness probe directly instead of `up --wait`: the
      # container healthcheck's 30s interval would add most of a minute
      # of dead time to every run.
      - name: Wait for /readyz
        run: |
          for _ in $(seq 1 60); do
            if curl --connect-timeout 2 --max-time 5 -fsS http://localhost:3000/readyz >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::app never answered /readyz"
          exit 1

      - name: Run the Playwright suite
        run: pnpm e2e

      - name: Show compose logs
        if: failure()
        run: docker compose -f compose.yml -f compose.dev.yml logs

      # Traces (retain-on-failure) plus the HTML report the config emits
      # under CI — download and `playwright show-report` to replay.
      - name: Upload Playwright traces and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            e2e/test-results/
            e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down the stack
        if: always()
        run: docker compose -f compose.yml -f compose.dev.yml down -v

  # The upgrade-fidelity gate (#260). Every other job starts from an
  # empty database, so the *first* install is tested on every commit and
  # the *second* never was. This one fills a baseline install through the
  # public API, swaps the images for this commit against the same
  # volumes, and checks the records still read back — the failure mode it
  # exists for is a migration that is fine against an empty table and
  # wrong against one with rows in it.
  #
  # Before the first release, use the event's base revision so a dev
  # push cannot silently rehearse an upgrade to the same commit.
  #
  # `pnpm upgrade-fidelity` runs the same rehearsal locally, on its own
  # compose project and ports. Keep the two in step.
  upgrade:
    name: An existing install survives an upgrade
    runs-on: ubuntu-latest
    # Two image builds, not one. The second reuses most of the first's
    # layers, but the bound has to clear both.
    timeout-minutes: 45
    steps:
      # Full history: the job checks out the baseline in place, in the
      # same working copy, and needs the tags to find it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # This job runs no pnpm and installs nothing — the fidelity script
      # is plain node and the stack is built by Compose. So the package
      # manager's cache is turned off rather than fed: setup-node reads
      # `packageManager` from package.json and switches caching on by
      # itself, and a job that never installs has no store for the
      # post-job save to find. It failed the job on that ("Path
      # Validation Error … no cache is being saved") after the rehearsal
      # itself had passed every step, which is the worst kind of red: a
      # green check turned red by cleanup. Turning the cache off also
      # takes the pnpm setup step with it — it was only ever here to put
      # the manager the cache had chosen on PATH.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - uses: docker/setup-buildx-action@v3

      # Throwaway per-run secrets, as in the E2E job. Written once and
      # kept across both halves: OPENLAW_SECRET_KEY has to be the same
      # value after the upgrade as before it, or the credentials the
      # baseline stored would be unreadable by design rather than by
      # fault (TECH-022).
      - name: Write the CI .env
        run: |
          {
            echo "AUTH_SECRET=$(openssl rand -base64 32)"
            echo "OPENLAW_SECRET_KEY=$(openssl rand -base64 32)"
            echo "BASE_URL=http://localhost:3000"
          } > .env

      # Out of the working copy before the baseline checkout replaces it.
      # One copy of the script drives both versions — see its own note on
      # why the seed may only use API surface the baseline already has.
      - name: Keep the fidelity script across the checkout
        run: cp e2e/scripts/upgrade-fidelity.mjs "$RUNNER_TEMP/upgrade-fidelity.mjs"

      - name: Pick the baseline and check it out
        id: baseline
        run: |
          # Explicit, so the selector does not depend on what the checkout
          # action happened to fetch for this event type.
          git fetch --force origin --tags "+refs/heads/dev:refs/remotes/origin/dev"
          ref=$(node e2e/scripts/upgrade-baseline.mjs)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Upgrading $ref to $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          git checkout --detach "$ref"

      - name: Build the baseline images
        uses: docker/bake-action@v6
        with:
          # Bake's default Git context would ignore the baseline checkout.
          source: .
          files: |
            compose.yml
            compose.dev.yml
          targets: app,doc-engine
          load: true
          set: |
            app.cache-from=type=gha,scope=ci-baseline-app-v1
            app.cache-to=type=gha,scope=ci-baseline-app-v1,mode=max
            doc-engine.cache-from=type=gha,scope=ci-baseline-doc-engine-v1
            doc-engine.cache-to=type=gha,scope=ci-baseline-doc-engine-v1,mode=max

      - name: Start the baseline stack
        run: docker compose -f compose.yml -f compose.dev.yml up -d --no-build

      - name: Wait for the baseline to answer /readyz
        run: |
          for _ in $(seq 1 60); do
            if curl --connect-timeout 2 --max-time 5 -fsS http://localhost:3000/readyz >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::the baseline stack never answered /readyz"
          exit 1

      - name: Fill the baseline install
        run: node "$RUNNER_TEMP/upgrade-fidelity.mjs" seed --out "$RUNNER_TEMP/fingerprint.json"

      # `down` without `-v`: the volumes are the install, and reusing
      # them is the whole point. `down -v` here would test nothing.
      - name: Stop the baseline, keeping its data
        run: docker compose -f compose.yml -f compose.dev.yml down

      # Through `env:`, not interpolated into the shell. The value is a
      # commit SHA today, so this is not exploitable — but expanding a
      # `${{ }}` into a `run:` body is the pattern that becomes an
      # injection the moment somebody edits it to use a ref or a title.
      - name: Bring the working copy back to this commit
        env:
          HEAD_SHA: ${{ github.sha }}
        run: git checkout --force "$HEAD_SHA"

      - name: Build this commit's images
        uses: docker/bake-action@v6
        with:
          source: .
          files: |
            compose.yml
            compose.dev.yml
          targets: app,doc-engine
          load: true
          set: |
            app.cache-from=type=gha,scope=ci-app-v1
            app.cache-from+=type=gha,scope=ci-baseline-app-v1
            doc-engine.cache-from=type=gha,scope=ci-doc-engine-v1
            doc-engine.cache-from+=type=gha,scope=ci-baseline-doc-engine-v1

      - name: Start this commit against the baseline's data
        run: docker compose -f compose.yml -f compose.dev.yml up -d --no-build

      - name: Wait for the upgraded stack to answer /readyz
        run: |
          for _ in $(seq 1 60); do
            if curl --connect-timeout 2 --max-time 5 -fsS http://localhost:3000/readyz >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::the upgraded stack never answered /readyz — check the migration log below"
          exit 1

      - name: Check every seeded record still reads back
        run: node "$RUNNER_TEMP/upgrade-fidelity.mjs" verify --in "$RUNNER_TEMP/fingerprint.json"

      # The migration output is in here, and it is the first thing to
      # read when this job fails.
      - name: Show compose logs
        if: failure()
        run: docker compose -f compose.yml -f compose.dev.yml logs

      - name: Tear down the stack
        if: always()
        run: docker compose -f compose.yml -f compose.dev.yml down -v
