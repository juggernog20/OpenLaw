#
# Gitleaks configuration for the Secret scan (history) CI job
# (.github/workflows/security.yml). It extends the default rules; the
# allowlist below names known non-secrets one by one, never whole files
# or directories. The scan covers commit history, so a flagged fixture
# is allowlisted here rather than reworded — rewording only changes the
# tip, and the finding stays in the commits that already carry it.

[extend]
useDefault = true

[allowlist]
description = "Fixture values that look like credentials and are not"
# "not-a-real-key" in base64 — the Azure account-key fixture in
# apps/api/src/lib/storage/config.test.ts.
#
# The two RSA-key-shaped fixtures in
# apps/api/src/modules/signing-connector/signing-connector.test.ts. They
# carry a PEM header so the suite proves what a pasted key does, and the
# body says in words that it is neither a key nor real. The DocuSign
# driver's own suite generates a genuine key pair at run time and stores
# none.
#
# The same shape again in
# apps/api/src/modules/onboarding/onboarding.test.ts, where the
# wizard's e-signature step reads whether a connector row exists and
# a connector row has to hold something key-shaped to be one.
#
# A bare PEM header typed into a key box by a web route test: the
# default private-key rule reads from one header to the next and calls
# everything between them a key, so two such lines in one file are read
# as one long secret. The header is followed here by the close of the
# `user.type()` call that typed it, which is why the pattern ends in
# `");` — a real key carries base64 there, never a string terminator.
regexes = [
  '''bm90LWEtcmVhbC1rZXk=''',
  '''openlawfixturekeyneverused''',
  '''openlawonboardingfixturekey''',
  '''-----BEGIN RSA PRIVATE KEY-----"\);''',
]
