# SPDX-License-Identifier: AGPL-3.0-only
#
# Development / E2E overlay (TECH-017, TECH-018): adds Mailpit as the
# SMTP sink and points both processes at it, and points signing at a
# stand-in on the host. Both are the same rule — an outbound side that
# must never reach a real account from a test run — and neither may ship
# in compose.yml, where a mail catcher would silently swallow real
# invites and a signing stand-in would swallow real envelopes.
#
#   docker compose -f compose.yml -f compose.dev.yml up
#
# Mail UI and pollable REST API (used by the E2E suite): http://localhost:8025

# What both processes need to reach the same stand-ins. The app and the
# worker are the same image running two commands, and both resolve the
# signing connector and the mail relay for themselves — the app to send
# an envelope and to verify a delivery, the worker to fetch an executed
# copy and to send every notification email (M18/1) — so a variable set
# on one and forgotten on the other is a send that works and a signed PDF
# that never lands, or a bell item that rings and an email nobody gets.
x-openlaw-dev-outbound: &openlaw-dev-outbound
  # Where the DocuSign driver dials, unset on every real install. The
  # E2E suite listens on this port on the host and answers DocuSign's
  # shapes (21-m15-demo.spec.ts); SIGNING_STUB_PORT moves it so a second
  # stack can run beside the default one.
  DOCUSIGN_BASE_URL: http://host.docker.internal:${SIGNING_STUB_PORT:-8129}
  # The second fact, and the reason the address alone is refused. It
  # carries no host and says one thing: this deployment is deliberately
  # not talking to DocuSign. compose.yml passes .env to both processes,
  # so a single stray DOCUSIGN_BASE_URL line would otherwise be enough
  # to send a real install's paper elsewhere. Both processes refuse to
  # boot on either variable without the other.
  SIGNING_STANDIN: "true"
  # The mail sink, on both processes for the signing address's reason.
  # A real install sets SMTP_URL in `.env`, which compose.yml passes to
  # the app and the worker alike; this overlay sets it here, and setting
  # it on the app alone left the worker resolving an unconfigured mailer
  # — so every immediate notification email and every morning digest was
  # recorded as skipped instead of delivered.
  SMTP_URL: smtp://mailpit:1025
  SMTP_FROM: OpenLaw <openlaw@localhost>

# host-gateway gives Linux engines the name Docker Desktop defines out
# of the box, which is how both processes reach the suite's own servers
# on the host: the mock OIDC issuer (10-settings.spec.ts), the signing
# stand-in (21-m15-demo.spec.ts), and the connector-addressed AI
# provider stand-in (38-m31-demo.spec.ts).
x-openlaw-dev-hosts: &openlaw-dev-hosts
  - "host.docker.internal:host-gateway"

services:
  app:
    environment:
      <<: *openlaw-dev-outbound
      # The E2E suite replays sign-in flows from one IP far faster than
      # any human; production keeps better-auth's limits.
      AUTH_RATE_LIMIT: "off"
      # Mounts POST /api/v1/notifications/morning-round, which no real
      # install carries (TECH-018). The morning round is a cron on the
      # hour, and the M18 demo cannot wait an hour for a tick; the round
      # itself is unchanged and still decides for itself whose morning it
      # is. Administrator-only even here.
      MORNING_ROUND_TRIGGER: "on"
    extra_hosts: *openlaw-dev-hosts

  worker:
    environment: *openlaw-dev-outbound
    extra_hosts: *openlaw-dev-hosts

  mailpit:
    # Pinned like every other image: `latest` could change delivery
    # behaviour between E2E runs without a repository change.
    image: axllent/mailpit:v1.30
    networks:
      # The app's network, because the app and the worker are what
      # deliver to it. Not the doc-engine one — a mail catcher has no
      # business being reachable from the container that opens
      # counterparty files.
      - openlaw-backend
    ports:
      # Loopback only — the UI and REST API are unauthenticated and show
      # every delivered token (set-password, magic links). MAILPIT_PORT
      # moves the host port so a second stack (the E2E suite's own
      # instance) can run beside the default one.
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped
