# SPDX-License-Identifier: AGPL-3.0-only
#
# The blessed OpenLaw deployment (TECH-005, TECH-017):
#
#   cp .env.example .env   # set AUTH_SECRET (openssl rand -base64 32)
#   docker compose up
#
# then reach http://<host>:3000 for first-run setup. TLS and the public
# hostname belong to your reverse proxy — see docs/DEPLOYMENT.md for the
# proxy contract. Services land here in the same change as the feature
# that needs them (TECH-017).
#
# Development and E2E add Mailpit via the overlay:
#
#   docker compose -f compose.yml -f compose.dev.yml up

# What the app and the worker both need. They are the same image running
# two commands (TECH-007), so they read the same database, the same
# storage, and the same doc engine — and a variable added to one and
# forgotten on the other is a worker that writes files somewhere the app
# cannot read them.
x-openlaw-environment: &openlaw-environment
  # Unset in .env = the bundled Postgres below; set it there for
  # external/managed Postgres (TECH-004 — both equally supported).
  DATABASE_URL: ${DATABASE_URL:-postgres://openlaw:openlaw@postgres:5432/openlaw}
  # Uploaded files (DOC-009, TECH-014). The default driver is the
  # local filesystem one — no extra service to run. STORAGE_PATH is
  # its root and the mount point of the named volume below; the two
  # must agree, so both read the same variable.
  STORAGE_DRIVER: ${STORAGE_DRIVER:-}
  STORAGE_PATH: ${STORAGE_PATH:-/var/lib/openlaw/files}
  # The S3-compatible driver, read only when STORAGE_DRIVER=s3.
  # Empty means unset — see .env.example for what each one means.
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  # The doc-engine sidecar (TECH-010). Unset in .env = the sidecar
  # below, reached by its service name on the compose network; set it
  # there to point at an engine you run yourself.
  DOC_ENGINE_URL: ${DOC_ENGINE_URL:-http://doc-engine:8080}
  DOC_ENGINE_TIMEOUT_MS: ${DOC_ENGINE_TIMEOUT_MS:-}

services:
  app:
    image: ghcr.io/juggernog20/openlaw:latest
    build: .
    env_file: .env
    environment:
      <<: *openlaw-environment
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required — generate one with `openssl rand -base64 32` and set it in .env}
      # Public origin (emailed links, Origin/CSRF checks — TECH-008),
      # interpolated from .env or the shell — the shell wins, so a stack
      # published on another port (the E2E fresh stack) can match its
      # origin. Empty means unset: the app falls back to its localhost
      # default and warns in production.
      BASE_URL: ${BASE_URL:-}
      # The upload ceiling in whole MB (story 24). Empty means unset:
      # the app falls back to its own default.
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-}
      # In-container listen address is fixed; PORT in .env moves the
      # published host port instead (see ports below).
      PORT: 3000
      HOST: 0.0.0.0
    volumes:
      # Files outlive the container (TECH-005) — no extra service to
      # run. A stack on the S3 driver leaves this volume empty; it costs
      # nothing and keeps whatever the local driver wrote before.
      - openlaw-files:${STORAGE_PATH:-/var/lib/openlaw/files}
    networks:
      # Both, because the app is the only thing that needs to be: it
      # talks to Postgres on one and to the doc engine on the other, and
      # it is what keeps those two apart.
      - openlaw-backend
      - openlaw-doc-engine
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      # Start order only, not a health gate. The database is what the app
      # cannot run without; the doc engine is not. A conversion that
      # cannot reach it falls back to download-only, so a doc-engine that
      # is slow to come up — or wedged — must never hold the whole
      # install down with it.
      doc-engine:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      # The image has node and no curl; readiness = the DB answers (TECH-014).
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    # The background worker (TECH-007): the same image as the app, run
    # with the worker command. It takes derivation jobs — text
    # extraction today (DOC-005) — off the queue pg-boss keeps in the
    # Postgres below. There is no broker and no fourth datastore: the
    # queue is tables in the database the install already runs.
    #
    # No published port and no healthcheck: it listens on nothing. It is
    # up when it is running, and what it did is in its logs.
    image: ghcr.io/juggernog20/openlaw:latest
    build: .
    command: ["node", "apps/worker/dist/index.js"]
    env_file: .env
    environment: *openlaw-environment
    volumes:
      # The same files the app wrote. A worker that could not read the
      # uploaded blob would fail every job it was given.
      - openlaw-files:${STORAGE_PATH:-/var/lib/openlaw/files}
    networks:
      # The app's two, for the app's reasons: the queue is in Postgres
      # and the derivation jobs call the doc engine.
      - openlaw-backend
      - openlaw-doc-engine
    depends_on:
      postgres:
        condition: service_healthy
      # Start order only, for the app's reason: a doc engine that is slow
      # to come up is a job that retries, not an install that is down.
      doc-engine:
        condition: service_started
      # The app is the one process that migrates (TECH-005), so the
      # worker starts after it. Order only — a worker that comes up
      # before the schema does finds no work and waits, which is the
      # right answer, and gating on the app's health would hold the
      # worker down for the app's whole start period.
      app:
        condition: service_started
    restart: unless-stopped
    # Compose sends SIGKILL ten seconds after SIGTERM by default, which
    # would cut the drain short. On a signal the worker stops taking new
    # jobs and waits for the one in hand, and the queue gives that wait
    # thirty seconds before it gives up on it — so the grace period has
    # to be longer than that or a stop is a kill.
    stop_grace_period: 60s

  doc-engine:
    # The document engine (TECH-010): headless LibreOffice for DOCX/PPTX
    # display conversion, OCRmyPDF/Tesseract for image-only PDFs, and a
    # thin HTTP wrapper over both. Our own image, built from this repo.
    #
    # No `ports` — like Postgres, it is reachable only on the compose
    # network and never published to the host. It carries no
    # authentication, because it has nothing to authorise: the app
    # decided who may read a file long before it sent the bytes. A
    # published port would turn that into an open conversion service.
    image: ghcr.io/juggernog20/openlaw-doc-engine:latest
    build:
      context: .
      dockerfile: services/doc-engine/Dockerfile
    # Stateless by design: it streams a file in, runs one tool, streams
    # the answer out, and keeps nothing. No volume, and nothing to back
    # up.
    #
    # This is the one container that opens files a counterparty sent us,
    # with LibreOffice and OCRmyPDF — large C++ parsers with a long
    # history of file-parsing bugs. Everything below assumes that one day
    # one of them is made to run attacker-chosen code, and asks what that
    # code can then reach. The answer should be: this container, its
    # /tmp, and nothing else.
    networks:
      # Not on `openlaw-backend`, so it cannot open a socket to Postgres
      # at all — there is no route, not merely no password. It needs
      # nothing from the database: it holds no state, reads no
      # DATABASE_URL, and every byte it works on arrives in a request
      # body. `openlaw-doc-engine` is `internal`, so it has no route off
      # the host either; the sidecar makes no outbound calls of its own,
      # and the apt install that builds the image happens at build time.
      - openlaw-doc-engine
    # Nothing writes to the image. LibreOffice and OCRmyPDF are given
    # /tmp and only /tmp: the Dockerfile sets HOME=/tmp, each conversion
    # gets a fresh LibreOffice user profile under a mkdtemp'd scratch
    # directory (`-env:UserInstallation`), OCRmyPDF and the Ghostscript
    # and Tesseract it drives inherit TMPDIR, and fontconfig's per-user
    # cache resolves under HOME. A tampered binary or a dropped payload
    # therefore does not survive a restart.
    read_only: true
    tmpfs:
      # mode 1777 because the container runs as the unprivileged `node`
      # user, not root. The size cap is what keeps a hostile file from
      # turning a conversion into a host memory event: tmpfs is RAM, and
      # an uncapped one defaults to half of it. Two gigabytes clears the
      # 100 MB upload ceiling with room for OCR's rasterised
      # intermediates, which are much larger than the file that produced
      # them. Raise DOC_ENGINE_TMPFS_SIZE if you OCR very long scans.
      - /tmp:mode=1777,size=${DOC_ENGINE_TMPFS_SIZE:-2g}
    # It binds port 8080 — above 1024 — and runs as `node`, so it needs
    # no capabilities whatsoever. Dropping all of them costs nothing and
    # takes the usual escalation primitives off the table.
    cap_drop:
      - ALL
    security_opt:
      # setuid binaries in the image cannot raise privilege. Ghostscript
      # and Tesseract are spawned as child processes of an untrusted
      # parse; this is what stops one of them being a way back up.
      - "no-new-privileges:true"
    restart: unless-stopped
    healthcheck:
      # The image has node, so the probe is the same shape as the app's.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  postgres:
    # Pinned to the major (TECH-004: PostgreSQL 16+). Only reachable on
    # the compose network — never published to the host.
    image: postgres:16
    environment:
      POSTGRES_USER: openlaw
      POSTGRES_PASSWORD: openlaw
      POSTGRES_DB: openlaw
    volumes:
      - openlaw-pgdata:/var/lib/postgresql/data
    networks:
      # Only this one. The doc engine is not on it, which is the whole
      # point of splitting them.
      - openlaw-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openlaw -d openlaw"]
      interval: 5s
      timeout: 5s
      retries: 10

# Two networks rather than one flat default, so that the container which
# opens counterparty files cannot reach the database (TECH-010,
# TECH-017). Every service names its networks explicitly: the moment one
# service declares `networks`, it stops joining `default` implicitly, and
# a service left off the list would silently lose name resolution to the
# rest of the stack.
networks:
  # The app, the worker, and Postgres — plus Mailpit in the dev overlay.
  # Not `internal`: the app reaches an SMTP relay, object storage,
  # DocuSign, and an IdP from here.
  openlaw-backend:
  # The app, the worker, and the doc engine. `internal` because the
  # sidecar makes no outbound calls at all, so the ability to make one is
  # pure downside. The app and the worker keep their egress through
  # openlaw-backend.
  openlaw-doc-engine:
    internal: true

volumes:
  openlaw-pgdata:
  openlaw-files:
