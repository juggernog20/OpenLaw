# Required metadata
sonar.projectKey=OpenLaw
sonar.projectName=OpenLaw
sonar.projectVersion=0.0.1

# Source and test directories
sonar.sources=apps,packages,services,e2e,styles,scripts
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.next/**,\
  **/build/**,\
  **/coverage/**,\
  **/.turbo/**,\
  **/*.d.ts

sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,e2e/tests/**

# Language file suffixes
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# =============================================================================
# RULE SUPPRESSIONS
# =============================================================================
# S6478 - "Move this component definition out of the parent component."
# False positive: these are ListEditor render-prop callbacks (rowMeta,
# rowActions, renameLabel), invoked as plain functions (rowMeta(row)),
# never rendered as a JSX element type. No remount risk.
#
# S6479 - "Do not use Array index in keys."
# False positive: each flagged list is read-only, rebuilt whole on every
# change, and never reordered — reviewed and commented in place at each
# site.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8

sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S6478
sonar.issue.ignore.multicriteria.e1.resourceKey=**/settings-approver-groups.tsx

sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S6478
sonar.issue.ignore.multicriteria.e2.resourceKey=**/taxonomy-types-pane.tsx

sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S6478
sonar.issue.ignore.multicriteria.e3.resourceKey=**/settings-contract-fields.tsx

sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S6478
sonar.issue.ignore.multicriteria.e4.resourceKey=**/settings-contract-statuses.tsx

sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S6479
sonar.issue.ignore.multicriteria.e5.resourceKey=**/approvals-signing-card.tsx

sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S6479
sonar.issue.ignore.multicriteria.e6.resourceKey=**/settings-audit-log.tsx

sonar.issue.ignore.multicriteria.e7.ruleKey=typescript:S6479
sonar.issue.ignore.multicriteria.e7.resourceKey=**/activity-applet.tsx

sonar.issue.ignore.multicriteria.e8.ruleKey=typescript:S6479
sonar.issue.ignore.multicriteria.e8.resourceKey=**/comment-applet.tsx
