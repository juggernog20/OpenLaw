version: 2

# Version updates target dev, the trunk. main moves only by fast-forward from
# dev (TECH-037). Security updates ignore target-branch and still open against
# main, the default branch. Retarget those to dev before they merge.
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # One PR per group keeps the monorepo's shared toolchain moving
    # together rather than as a dozen single-package bumps.
    groups:
      typescript-toolchain:
        patterns:
          - "typescript"
          - "@typescript/*"
          - "typescript-eslint"
          - "eslint"
          - "@eslint/*"
          - "prettier"
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
